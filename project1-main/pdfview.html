<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>VTU Results PDF</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            background: #e3e7fd;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pdf-container {
            background: #fff;
            padding: 1.5rem 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            width: 90vw;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .pdf-actions {
            margin-bottom: 1rem;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            gap: 1rem;
        }
        button, a.download-btn {
            padding: 0.6rem 1.2rem;
            background: #1a237e;
            color: #fff;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        button:hover, a.download-btn:hover {
            background: #3949ab;
        }
        iframe {
            width: 100%;
            height: 600px;
            border: 1px solid #bdbdbd;
            border-radius: 5px;
        }
        @media (max-width: 800px) {
            .pdf-container {
                padding: 1rem;
                max-width: 98vw;
            }
            iframe {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="pdf-container">
        <div class="pdf-actions">
            <a id="downloadBtn" class="download-btn" href="#" download>Download PDF</a>
            <button id="cancelBtn">Cancel</button>
        </div>
        <iframe id="pdfFrame" src="" frameborder="0"></iframe>
    </div>
    <script>
        // Get PDF file from query string
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }
        const pdfFile = getQueryParam('file');
        if (!pdfFile) {
            document.body.innerHTML = "<h2 style='color:#d32f2f;text-align:center;'>Error: No PDF file specified.</h2>";
        } else {
            document.getElementById('pdfFrame').src = pdfFile;
            document.getElementById('downloadBtn').href = pdfFile;
        }
        document.getElementById('cancelBtn').onclick = function() {
            window.location.href = "vturesult.html";
        };
    </script>
</body>
</html>
